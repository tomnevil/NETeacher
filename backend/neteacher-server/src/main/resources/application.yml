spring:
  application:
    name: neteacher-server
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  datasource:
    url: jdbc:h2:mem:neteacher;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: neteacher-dev-secret-change-me-please-use-env-in-prod-2026
  expiration: 86400000

ai:
  llm-provider: mock
  llm:
    base-url: https://api.deepseek.com/v1
    api-key: ${AI_LLM_API_KEY:}
    model: deepseek-chat

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
